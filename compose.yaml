name: impromptu

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: impromptu
      POSTGRES_USER: impromptu
      POSTGRES_PASSWORD: impromptu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impromptu -d impromptu"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w @impromptu/api
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://impromptu:impromptu@postgres:5432/impromptu
      DEV_DATABASE_RESET: "true"
      NODE_ENV: development
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: local-development-secret-at-least-32-chars
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      NODE_OPTIONS: --conditions=development
    expose:
      - "3000"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w @impromptu/web -- --host 0.0.0.0
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
      NODE_OPTIONS: --conditions=development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/app:/workspace/apps/web/app
      - ./apps/api/src:/workspace/apps/api/src:ro

volumes:
  postgres-data:

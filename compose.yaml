name: impromptu

services:
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit-data:/data

  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: impromptu
      POSTGRES_USER: impromptu
      POSTGRES_PASSWORD: impromptu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impromptu -d impromptu"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w @impromptu/api
    depends_on:
      mailpit:
        condition: service_healthy
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAILPIT_URL: http://mailpit:8025
      PUBLIC_ORIGIN: http://localhost:5173
      MAILBOX_ACCOUNT_IDS: ${MAILBOX_ACCOUNT_IDS:-d3000000-0000-4000-8000-000000000001}
      DATABASE_URL: postgresql://impromptu:impromptu@postgres:5432/impromptu
      DEV_DATABASE_RESET: "true"
      NODE_ENV: development
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: local-development-secret-at-least-32-chars
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      NODE_OPTIONS: --conditions=development
    expose:
      - "3000"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w @impromptu/web -- --host 0.0.0.0
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
      NODE_OPTIONS: --conditions=development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/app:/workspace/apps/web/app
      - ./apps/api/src:/workspace/apps/api/src:ro

volumes:
  mailpit-data:
  postgres-data:

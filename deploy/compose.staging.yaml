name: impromptu-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:1126:1025"
      - "127.0.0.1:8126:8025"
    logging: *default-logging

  app:
    depends_on:
      mailpit:
        condition: service_healthy
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image reference}
    network_mode: host
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.15
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3001/api/health]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    environment:
      HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1126
      MAILPIT_URL: http://127.0.0.1:8126
      PUBLIC_ORIGIN: https://${APP_HOSTNAME:?Set APP_HOSTNAME}
      MAILBOX_ACCOUNT_IDS: ${MAILBOX_ACCOUNT_IDS:-}
      DATABASE_URL: ${DATABASE_URL:?Set staging DATABASE_URL}
      MIGRATION_DATABASE_URL:
        ${MIGRATION_DATABASE_URL:?Set staging MIGRATION_DATABASE_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set staging LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set staging LIVEKIT_API_SECRET}
      LIVEKIT_API_URL: http://127.0.0.1:7890
      LIVEKIT_PUBLIC_URL:
        wss://${LIVEKIT_HOSTNAME:?Set staging LIVEKIT_HOSTNAME}
      PORT: 3001
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.35
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS:
        "${LIVEKIT_API_KEY:?Set staging LIVEKIT_API_KEY}:
        ${LIVEKIT_API_SECRET:?Set staging LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.staging.yaml:/etc/livekit.yaml:ro
    logging: *default-logging

volumes:
  mailpit-data:

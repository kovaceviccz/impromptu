name: impromptu-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image reference}
    network_mode: host
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.15
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3001/api/health]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    environment:
      HOST: 127.0.0.1
      DATABASE_URL: ${DATABASE_URL:?Set staging DATABASE_URL}
      MIGRATION_DATABASE_URL:
        ${MIGRATION_DATABASE_URL:?Set staging MIGRATION_DATABASE_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set staging LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set staging LIVEKIT_API_SECRET}
      LIVEKIT_API_URL: http://127.0.0.1:7890
      LIVEKIT_PUBLIC_URL:
        wss://${LIVEKIT_HOSTNAME:?Set staging LIVEKIT_HOSTNAME}
      PORT: 3001
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.35
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS:
        "${LIVEKIT_API_KEY:?Set staging LIVEKIT_API_KEY}:
        ${LIVEKIT_API_SECRET:?Set staging LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.staging.yaml:/etc/livekit.yaml:ro
    logging: *default-logging

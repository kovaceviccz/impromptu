name: impromptu-database

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    env_file: ${DATABASE_ENV_FILE:-./secrets/database.env}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=256MB
      - -c
      - statement_timeout=15s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  postgres-data:
